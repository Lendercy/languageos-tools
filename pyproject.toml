[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "languageos-tools"
version = "0.1.0"
description = "Local-first tools for building a personal LanguageOS system."
requires-python = ">=3.11"
dependencies = [
    "requests>=2.32.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.8.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 88
src = ["src", "scripts", "tests"]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
]
ignore = [
    "E501",  # line too long; handle gradually with formatter/refactor
    "B905",  # zip(strict=...) can be fixed later in legacy parsers
]

[tool.ruff.lint.per-file-ignores]
"scripts/*.py" = [
    "E402",  # scripts intentionally patch sys.path before importing package CLI entrypoints
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"